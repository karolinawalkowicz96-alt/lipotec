<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{page.canonical}}">
{{#if page.noindex}}<meta name="robots" content="noindex,follow">{{/if}}
<meta property="og:type" content="{{#if page.date}}article{{else}}website{{/if}}">
<meta property="og:locale" content="pl_PL">
<meta property="og:site_name" content="LIPOTEC">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{page.canonical}}">
<meta property="og:image" content="{{company.siteUrl}}/assets/img/og-eva-sp6.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Wizualizacja systemu EVA SP6 na czarnym tle">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Manrope:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="{{asset:/assets/css/site.css}}">
{{#if page.preload}}<link rel="preload" as="image" href="{{page.preload}}" fetchpriority="high">{{/if}}
<script type="application/ld+json">{{{jsonld}}}</script>
<script src="{{asset:/assets/js/site.js}}" defer></script>
</head>
<body class="{{page.bodyClass}}">
<a class="skip-link" href="#main">Przejdź do treści</a>
{{> icons}}
{{> nav}}
<main id="main">
{{{content}}}
</main>
{{> footer}}
</body>
</html>
