<section class="section cta-band" aria-labelledby="cta-title">
  <div class="wrap cta-inner">
    <h2 class="h-section" id="cta-title"><span class="line">Porozmawiajmy</span><span class="line gold-text">o Twojej placówce.</span></h2>
    <div class="side">
      <p>Opisz profil kliniki i to, czego potrzebujesz: informacji o EVA SP6, prezentacji urządzenia albo indywidualnej oferty. Odpowiadamy na zapytania od placówek i lekarzy.</p>
      <div class="btn-row">
        <a class="btn btn-gold" href="/kontakt">Zapytaj o urządzenie<svg aria-hidden="true"><use href="#i-arrow"/></svg></a>
        <a class="btn btn-ghost" href="mailto:{{company.email}}">{{company.email}}</a>
      </div>
    </div>
  </div>
</section>
