<section class="section cta-band" id="zapytanie" aria-labelledby="cta-title">
  <div class="wrap split">
    <div class="stack cta-copy">
      <p class="kicker">Zapytanie</p>
      <h2 class="h-section" id="cta-title"><span class="line">Porozmawiajmy</span><span class="line gold-text">o Twojej placówce.</span></h2>
      <p class="note">Opisz profil kliniki i to, czego potrzebujesz: informacji o EVA SP6, prezentacji urządzenia albo indywidualnej oferty. Odpowiemy na adres e-mail podany w formularzu.</p>
      <a class="cta-mail" href="mailto:{{company.email}}"><svg aria-hidden="true"><use href="#i-mail"/></svg>{{company.email}}</a>
      {{#if company.phone}}<a class="cta-mail" href="tel:{{company.phone}}">{{company.phone}}</a>{{/if}}
    </div>
    {{> contact-form}}
  </div>
</section>
